name: Relato de bug
description: Informe um comportamento inesperado no projeto.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Antes de enviar, verifique se ja existe uma issue sobre o mesmo problema.
  - type: textarea
    id: summary
    attributes:
      label: Descricao
      description: Explique o problema de forma objetiva.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Como reproduzir
      description: Liste os passos necessarios para reproduzir o problema.
      placeholder: |
        1. Acesse...
        2. Selecione...
        3. Observe o erro
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Comportamento esperado
      description: O que deveria acontecer?
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Ambiente
      description: Informe navegador, sistema operacional ou versao relevante.
    validations:
      required: false
